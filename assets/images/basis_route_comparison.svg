<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">Good and bad bases reaching the same lattice point</title>
  <desc id="description">Two panels show bases for the same square lattice. The good basis reaches the target in two short steps, while the bad basis follows six long, cancelling steps to reach the same point.</desc>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8da2b5" />
    </marker>
    <filter id="target-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <circle id="grid-point" r="4.5" fill="#8da2b5" />
    <g id="grid-row">
      <use href="#grid-point" x="90" y="500" /><use href="#grid-point" x="140" y="500" /><use href="#grid-point" x="190" y="500" /><use href="#grid-point" x="240" y="500" /><use href="#grid-point" x="290" y="500" /><use href="#grid-point" x="340" y="500" /><use href="#grid-point" x="390" y="500" /><use href="#grid-point" x="440" y="500" /><use href="#grid-point" x="490" y="500" />
    </g>
    <g id="lattice-grid" opacity="0.58">
      <use href="#grid-row" />
      <use href="#grid-row" transform="translate(0 -70)" />
      <use href="#grid-row" transform="translate(0 -140)" />
      <use href="#grid-row" transform="translate(0 -210)" />
      <use href="#grid-row" transform="translate(0 -280)" />
    </g>
  </defs>

  <rect width="1200" height="540" fill="#07111f" />
  <rect x="28" y="22" width="534" height="496" rx="12" fill="#091625" stroke="#20384d" stroke-width="2" />
  <rect x="638" y="22" width="534" height="496" rx="12" fill="#091625" stroke="#20384d" stroke-width="2" />

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="295" y="67" fill="#e7f3fb" font-size="28" font-weight="600">Good basis</text>
    <text x="905" y="67" fill="#e7f3fb" font-size="28" font-weight="600">Bad basis</text>
  </g>
  <g fill="none" stroke="#38526a" stroke-width="1.3" opacity="0.42">
    <line x1="68" y1="500" x2="520" y2="500" /><line x1="90" y1="530" x2="90" y2="185" />
    <line x1="628" y1="500" x2="1080" y2="500" /><line x1="650" y1="530" x2="650" y2="185" />
  </g>

  <use href="#lattice-grid" />
  <use href="#lattice-grid" transform="translate(560 0)" />

  <g fill="none" stroke-linecap="round" opacity="0.52">
    <path d="M90 500 L140 500" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow-cyan)" />
    <path d="M90 500 L90 430" stroke="#8da2b5" stroke-width="4" marker-end="url(#arrow-slate)" />
    <path d="M650 500 L750 430" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow-cyan)" />
    <path d="M650 500 L800 360" stroke="#8da2b5" stroke-width="4" marker-end="url(#arrow-slate)" />
  </g>

  <g font-family="Cambria Math, Cambria, serif" font-size="20" font-style="italic">
    <text x="149" y="493" fill="#67e8f9">g<tspan baseline-shift="sub" font-size="13">1</tspan></text>
    <text x="99" y="422" fill="#b2c4d3">g<tspan baseline-shift="sub" font-size="13">2</tspan></text>
    <text x="759" y="425" fill="#67e8f9">b<tspan baseline-shift="sub" font-size="13">1</tspan></text>
    <text x="808" y="350" fill="#b2c4d3">b<tspan baseline-shift="sub" font-size="13">2</tspan></text>
  </g>

  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path pathLength="1" d="M90 500 L140 500" stroke="#22d3ee" stroke-dasharray="1" marker-end="url(#arrow-cyan)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.079;.08;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.08;.16;.9;1" />
    </path>
    <path pathLength="1" d="M140 500 L190 500" stroke="#22d3ee" stroke-dasharray="1" marker-end="url(#arrow-cyan)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.179;.18;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.18;.26;.9;1" />
    </path>

    <path pathLength="1" d="M650 500 L750 430" stroke="#22d3ee" stroke-dasharray="1" marker-end="url(#arrow-cyan)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.079;.08;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.08;.17;.9;1" />
    </path>
    <path pathLength="1" d="M750 430 L850 360" stroke="#22d3ee" stroke-dasharray="1" marker-end="url(#arrow-cyan)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.189;.19;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.19;.28;.9;1" />
    </path>
    <path pathLength="1" d="M850 360 L950 290" stroke="#22d3ee" stroke-dasharray="1" marker-end="url(#arrow-cyan)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.299;.30;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.30;.39;.9;1" />
    </path>
    <path pathLength="1" d="M950 290 L1050 220" stroke="#22d3ee" stroke-dasharray="1" marker-end="url(#arrow-cyan)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.409;.41;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.41;.50;.9;1" />
    </path>
    <path pathLength="1" d="M1050 220 L900 360" stroke="#8da2b5" stroke-dasharray="1" marker-end="url(#arrow-slate)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.519;.52;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.52;.61;.9;1" />
    </path>
    <path pathLength="1" d="M900 360 L750 500" stroke="#8da2b5" stroke-dasharray="1" marker-end="url(#arrow-slate)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.629;.63;.9;1" />
      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.63;.72;.9;1" />
    </path>
  </g>

  <g>
    <circle cx="190" cy="500" r="25" fill="#22d3ee" filter="url(#target-glow)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.2;.2;0" keyTimes="0;.70;.72;.9;1" />
    </circle>
    <circle cx="750" cy="500" r="25" fill="#22d3ee" filter="url(#target-glow)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.2;.2;0" keyTimes="0;.70;.72;.9;1" />
    </circle>
    <circle cx="190" cy="500" r="8" fill="#67e8f9">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.70;.72;.9;1" />
    </circle>
    <circle cx="750" cy="500" r="8" fill="#67e8f9">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.70;.72;.9;1" />
    </circle>
  </g>

</svg>
