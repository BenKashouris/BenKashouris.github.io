<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">How determinant one and determinant two transform a lattice basis</title>
  <desc id="description">Both panels begin with the same square basis. On the left, a determinant-one shear preserves the fundamental area and all lattice points. On the right, a determinant-two shear and stretch doubles the area and leaves only every other row in the generated sublattice.</desc>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#f59e0b" />
    </marker>
    <circle id="point" r="4.8" />
    <g id="row">
      <use href="#point" x="82" y="452" /><use href="#point" x="134" y="452" /><use href="#point" x="186" y="452" />
      <use href="#point" x="238" y="452" /><use href="#point" x="290" y="452" /><use href="#point" x="342" y="452" />
      <use href="#point" x="394" y="452" /><use href="#point" x="446" y="452" /><use href="#point" x="498" y="452" />
    </g>
    <style>
      .loop {
        animation-duration: 14s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      .left-transform { animation-name: left-transform; transform-origin: 0 0; }
      .right-transform { animation-name: right-transform; transform-origin: 0 0; }
      .skipped-rows { animation-name: skipped-rows; }
      .initial-label { animation-name: initial-label; }
      .final-label { animation-name: final-label; opacity: 0; }
      .math-label { paint-order: stroke; stroke: #091625; stroke-width: 6px; stroke-linejoin: round; }

      @keyframes left-transform {
        0%, 16% { transform: matrix(1, 0, 0, 1, 0, 0); }
        38%, 84% { transform: matrix(1, 0, -1.733, 1, 0, 0); }
        100% { transform: matrix(1, 0, 0, 1, 0, 0); }
      }
      @keyframes right-transform {
        0%, 16% { transform: matrix(1, 0, 0, 1, 0, 0); }
        38%, 84% { transform: matrix(1, 0, -1.733, 2, 0, 0); }
        100% { transform: matrix(1, 0, 0, 1, 0, 0); }
      }
      @keyframes skipped-rows {
        0%, 22% { opacity: 0.72; }
        42%, 84% { opacity: 0.16; }
        100% { opacity: 0.72; }
      }
      @keyframes initial-label {
        0%, 18% { opacity: 1; }
        34%, 88% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes final-label {
        0%, 24% { opacity: 0; }
        42%, 82% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .loop { animation: none; }
        .left-transform { transform: matrix(1, 0, -1.733, 1, 0, 0); }
        .right-transform { transform: matrix(1, 0, -1.733, 2, 0, 0); }
        .skipped-rows { opacity: 0.16; }
        .initial-label { opacity: 0; }
        .final-label { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#07111f" />
  <rect x="28" y="22" width="534" height="496" rx="12" fill="#091625" stroke="#20384d" stroke-width="2" />
  <rect x="638" y="22" width="534" height="496" rx="12" fill="#091625" stroke="#20384d" stroke-width="2" />

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="295" y="72" fill="#6ee7b7" font-size="28" font-weight="600">det U = 1</text>
    <text x="905" y="72" fill="#fda4af" font-size="28" font-weight="600">det U = 2</text>
  </g>

  <g fill="none" stroke="#38526a" stroke-width="1.25" opacity="0.43">
    <path d="M56 452 H534 M134 486 V140" />
    <path d="M666 452 H1144 M744 486 V140" />
  </g>

  <g fill="#8da2b5" opacity="0.72">
    <use href="#row" /><use href="#row" transform="translate(0 -60)" /><use href="#row" transform="translate(0 -120)" />
    <use href="#row" transform="translate(0 -180)" /><use href="#row" transform="translate(0 -240)" /><use href="#row" transform="translate(0 -300)" />
  </g>

  <g transform="translate(610 0)" fill="#8da2b5">
    <g opacity="0.72">
      <use href="#row" /><use href="#row" transform="translate(0 -120)" /><use href="#row" transform="translate(0 -240)" />
    </g>
    <g class="skipped-rows loop" opacity="0.72">
      <use href="#row" transform="translate(0 -60)" /><use href="#row" transform="translate(0 -180)" /><use href="#row" transform="translate(0 -300)" />
    </g>
  </g>

  <g transform="translate(134 452)">
    <path class="left-transform loop" d="M0 0 H52 V-60 H0Z" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="2" />
    <path d="M0 0 H52" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-cyan)" />
    <path class="left-transform loop" d="M0 0 V-60" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-cyan)" />
  </g>

  <g transform="translate(744 452)">
    <path class="right-transform loop" d="M0 0 H52 V-60 H0Z" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="2" />
    <path d="M0 0 H52" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-amber)" />
    <path class="right-transform loop" d="M0 0 V-60" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-amber)" />
  </g>

  <g class="initial-label loop" font-family="Cambria Math, Cambria, serif" font-size="23" font-style="italic" font-weight="700" text-anchor="middle">
    <text x="160" y="423" fill="#a5f3fc">A</text>
    <text x="770" y="423" fill="#fde68a">A</text>
  </g>
  <g class="final-label loop" font-family="Cambria Math, Cambria, serif" font-size="23" font-style="italic" font-weight="700" text-anchor="middle">
    <text x="212" y="423" fill="#a5f3fc">A</text>
    <text x="822" y="393" fill="#fde68a">2A</text>
  </g>

  <g class="initial-label loop math-label" fill="#b2c4d3" font-family="Cambria Math, Cambria, serif" font-size="20" font-style="italic">
    <text x="146" y="382">b₂</text><text x="756" y="382">b₂</text>
  </g>
  <g class="final-label loop math-label" font-family="Cambria Math, Cambria, serif" font-size="20" font-style="italic">
    <text x="247" y="384" fill="#67e8f9">b′₂</text><text x="857" y="324" fill="#fbbf24">b′₂</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text class="initial-label loop" x="295" y="494" fill="#71899c" font-size="18">Start with the same basis B</text>
    <text class="initial-label loop" x="905" y="494" fill="#71899c" font-size="18">Start with the same basis B</text>
    <text class="final-label loop" x="295" y="494" fill="#6ee7b7" font-size="18" font-weight="600">Area unchanged · every point retained</text>
    <text class="final-label loop" x="905" y="494" fill="#fda4af" font-size="18" font-weight="600">Area doubled · every other row skipped</text>
  </g>
</svg>
