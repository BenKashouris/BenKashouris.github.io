<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">A lattice generated by repeatedly adding basis vectors</title>
  <desc id="description">Two basis vectors are shown on coordinate axes. Animated copies of the vectors move between lattice points, leaving a new point behind after each addition until the lattice is filled.</desc>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8da2b5" />
    </marker>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <style>
      .step {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: take-step 28s linear infinite;
        animation-delay: var(--delay);
      }

      .lattice-point {
        opacity: 0;
      }

      @keyframes take-step {
        0% {
          stroke-dashoffset: 1;
          opacity: 1;
        }
        3% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        3.6%, 100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .step {
          animation: none;
          opacity: 0;
        }

        .lattice-point {
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <rect width="1000" height="640" fill="#07111f" />

  <g fill="none" stroke="#38526a" stroke-width="1.5" opacity="0.72">
    <line x1="74" y1="340" x2="926" y2="340" />
    <line x1="500" y1="580" x2="500" y2="74" />
  </g>
  <g fill="#60798e" font-family="Cambria Math, Cambria, serif" font-size="20" font-style="italic">
    <text x="935" y="347">x</text>
    <text x="489" y="62">y</text>
  </g>

  <g fill="none" stroke-linecap="round" opacity="0.48">
    <path d="M500 340 L620 322" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow-cyan)" />
    <path d="M500 340 L555 245" stroke="#8da2b5" stroke-width="4" marker-end="url(#arrow-slate)" />
  </g>
  <g font-family="Cambria Math, Cambria, serif" font-size="24" font-style="italic">
    <text x="632" y="318" fill="#67e8f9">b<tspan baseline-shift="sub" font-size="15">1</tspan></text>
    <text x="563" y="234" fill="#b2c4d3">b<tspan baseline-shift="sub" font-size="15">2</tspan></text>
  </g>

  <g opacity="0.16" filter="url(#soft-glow)">
    <circle cx="500" cy="340" r="22" fill="#22d3ee" />
  </g>
  <circle cx="500" cy="340" r="8" fill="#e7f3fb" />
  <circle cx="500" cy="340" r="3" fill="#22d3ee" />

  <g>
    <path class="step" pathLength="1" style="--delay: 0s" d="M500 340 L620 322" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 1s" d="M620 322 L675 227" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 2s" d="M675 227 L555 245" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 3s" d="M555 245 L435 263" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 4s" d="M435 263 L380 358" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 5s" d="M380 358 L325 453" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 6s" d="M325 453 L445 435" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 7s" d="M445 435 L565 417" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 8s" d="M565 417 L685 399" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 9s" d="M685 399 L740 304" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 10s" d="M740 304 L795 209" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 11s" d="M795 209 L850 114" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 12s" d="M850 114 L730 132" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 13s" d="M730 132 L610 150" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 14s" d="M610 150 L490 168" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 15s" d="M490 168 L370 186" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 16s" d="M370 186 L315 281" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 17s" d="M315 281 L260 376" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 18s" d="M260 376 L205 471" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 19s" d="M205 471 L150 566" stroke="#8da2b5" marker-end="url(#arrow-slate)" />
    <path class="step" pathLength="1" style="--delay: 20s" d="M150 566 L270 548" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 21s" d="M270 548 L390 530" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 22s" d="M390 530 L510 512" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
    <path class="step" pathLength="1" style="--delay: 23s" d="M510 512 L630 494" stroke="#22d3ee" marker-end="url(#arrow-cyan)" />
  </g>

  <g fill="#b2c4d3">
    <circle class="lattice-point" cx="620" cy="322" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.035;.036;.96;1" /></circle>
    <circle class="lattice-point" cx="675" cy="227" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.070;.071;.96;1" /></circle>
    <circle class="lattice-point" cx="555" cy="245" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.106;.107;.96;1" /></circle>
    <circle class="lattice-point" cx="435" cy="263" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.142;.143;.96;1" /></circle>
    <circle class="lattice-point" cx="380" cy="358" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.178;.179;.96;1" /></circle>
    <circle class="lattice-point" cx="325" cy="453" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.213;.214;.96;1" /></circle>
    <circle class="lattice-point" cx="445" cy="435" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.249;.250;.96;1" /></circle>
    <circle class="lattice-point" cx="565" cy="417" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.285;.286;.96;1" /></circle>
    <circle class="lattice-point" cx="685" cy="399" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.320;.321;.96;1" /></circle>
    <circle class="lattice-point" cx="740" cy="304" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.356;.357;.96;1" /></circle>
    <circle class="lattice-point" cx="795" cy="209" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.392;.393;.96;1" /></circle>
    <circle class="lattice-point" cx="850" cy="114" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.428;.429;.96;1" /></circle>
    <circle class="lattice-point" cx="730" cy="132" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.463;.464;.96;1" /></circle>
    <circle class="lattice-point" cx="610" cy="150" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.499;.500;.96;1" /></circle>
    <circle class="lattice-point" cx="490" cy="168" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.535;.536;.96;1" /></circle>
    <circle class="lattice-point" cx="370" cy="186" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.570;.571;.96;1" /></circle>
    <circle class="lattice-point" cx="315" cy="281" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.606;.607;.96;1" /></circle>
    <circle class="lattice-point" cx="260" cy="376" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.642;.643;.96;1" /></circle>
    <circle class="lattice-point" cx="205" cy="471" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.678;.679;.96;1" /></circle>
    <circle class="lattice-point" cx="150" cy="566" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.713;.714;.96;1" /></circle>
    <circle class="lattice-point" cx="270" cy="548" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.749;.750;.96;1" /></circle>
    <circle class="lattice-point" cx="390" cy="530" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.785;.786;.96;1" /></circle>
    <circle class="lattice-point" cx="510" cy="512" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.820;.821;.96;1" /></circle>
    <circle class="lattice-point" cx="630" cy="494" r="7"><animate attributeName="opacity" dur="28s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.856;.857;.96;1" /></circle>
  </g>
</svg>
