<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Lattice with a small error displacement</title>
  <desc id="description">A flat field of lattice points on a deep navy background. Two basis vectors outline one fundamental cell, while a highlighted noisy point sits a short distance from another lattice point.</desc>

  <defs>
    <radialGradient id="ambient-glow" cx="70%" cy="42%" r="72%">
      <stop offset="0" stop-color="#112b42" stop-opacity="0.58" />
      <stop offset="0.5" stop-color="#071827" stop-opacity="0.24" />
      <stop offset="1" stop-color="#050c16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cell-fill" x1="716" y1="542" x2="904" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.04" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.2" />
    </linearGradient>
    <filter id="point-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8da2b5" />
    </marker>
    <circle id="lattice-point" r="7" fill="#b2c4d3" />
  </defs>

  <rect width="1600" height="900" fill="#050c16" />
  <rect width="1600" height="900" fill="url(#ambient-glow)" />
  <ellipse cx="1160" cy="420" rx="320" ry="250" fill="#22d3ee" opacity="0.035" filter="url(#soft-glow)" />

