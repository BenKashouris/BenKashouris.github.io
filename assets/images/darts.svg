<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Dartboard with an aiming point and throw spread</title>
  <desc id="description">A fine-line slate dartboard on deep navy, with a cyan cross at treble 20 and pale dots scattered around it. The illustrative spread shows throws landing in neighbouring scoring regions; it is not simulation data.</desc>

  <defs>
    <radialGradient id="ambient-glow" cx="50%" cy="45%" r="54%">
      <stop offset="0" stop-color="#112338" stop-opacity="0.54" />
      <stop offset="0.62" stop-color="#07111f" stop-opacity="0.2" />
      <stop offset="1" stop-color="#050c16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aim-glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="0.4" stop-color="#22d3ee" stop-opacity="0.07" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <!-- One 18-degree sector, bounded at +/-9 degrees from vertical. -->
    <path id="sector-fill" d="M-4.83 -30.48 L-51.62 -325.94 A330 330 0 0 1 51.62 -325.94 L4.83 -30.48 A30.86 30.86 0 0 0 -4.83 -30.48Z" />
    <path id="sector-wire" d="M4.83 -30.48 51.62 -325.94" />
  </defs>

  <rect width="1600" height="900" fill="#050c16" />
  <rect width="1600" height="900" fill="url(#ambient-glow)" />

  <!-- Standard scoring radii in millimetres, scaled by 330/170.
       Double: 162-170; treble: 99-107; outer/inner bull: 15.9/6.35. -->
  <g transform="translate(800 450)">
    <g fill="#8da2b5" opacity="0.065">
      <use href="#sector-fill" transform="rotate(0)" />
      <use href="#sector-fill" transform="rotate(36)" />
      <use href="#sector-fill" transform="rotate(72)" />
      <use href="#sector-fill" transform="rotate(108)" />
      <use href="#sector-fill" transform="rotate(144)" />
      <use href="#sector-fill" transform="rotate(180)" />
      <use href="#sector-fill" transform="rotate(216)" />
      <use href="#sector-fill" transform="rotate(252)" />
      <use href="#sector-fill" transform="rotate(288)" />
      <use href="#sector-fill" transform="rotate(324)" />
    </g>
    <g fill="none" stroke="#8da2b5" stroke-width="3" opacity="0.48">
      <use href="#sector-wire" transform="rotate(0)" />
      <use href="#sector-wire" transform="rotate(18)" />
      <use href="#sector-wire" transform="rotate(36)" />
      <use href="#sector-wire" transform="rotate(54)" />
      <use href="#sector-wire" transform="rotate(72)" />
      <use href="#sector-wire" transform="rotate(90)" />
      <use href="#sector-wire" transform="rotate(108)" />
      <use href="#sector-wire" transform="rotate(126)" />
      <use href="#sector-wire" transform="rotate(144)" />
      <use href="#sector-wire" transform="rotate(162)" />
      <use href="#sector-wire" transform="rotate(180)" />
      <use href="#sector-wire" transform="rotate(198)" />
      <use href="#sector-wire" transform="rotate(216)" />
      <use href="#sector-wire" transform="rotate(234)" />
      <use href="#sector-wire" transform="rotate(252)" />
      <use href="#sector-wire" transform="rotate(270)" />
      <use href="#sector-wire" transform="rotate(288)" />
      <use href="#sector-wire" transform="rotate(306)" />
      <use href="#sector-wire" transform="rotate(324)" />
      <use href="#sector-wire" transform="rotate(342)" />
    </g>
    <g fill="none" stroke="#8da2b5" stroke-width="3.5" opacity="0.66">
      <circle r="330" />
      <circle r="314.47" />
      <circle r="207.71" />
      <circle r="192.18" />
      <circle r="30.86" />
      <circle r="12.33" />
    </g>
  </g>

  <!-- Fixed illustrative throws around the radial midpoint of treble 20. -->
  <g transform="translate(800 250.06)">
    <circle r="125" fill="url(#aim-glow)" />
    <g fill="#b2c4d3">
      <circle cx="-16" cy="-16" r="5" opacity="0.9" />
      <circle cx="22" cy="-9" r="4.5" opacity="0.85" />
      <circle cx="-7" cy="25" r="5" opacity="0.8" />
      <circle cx="13" cy="38" r="4" opacity="0.7" />
      <circle cx="-34" cy="12" r="4.5" opacity="0.85" />
      <circle cx="38" cy="19" r="5" opacity="0.75" />
      <circle cx="6" cy="-33" r="4.5" opacity="0.9" />
      <circle cx="-28" cy="-40" r="4" opacity="0.65" />
      <circle cx="32" cy="-34" r="4.5" opacity="0.78" />
      <circle cx="-48" cy="-17" r="5" opacity="0.75" />
      <circle cx="54" cy="-5" r="4" opacity="0.62" />
      <circle cx="-18" cy="48" r="4.5" opacity="0.7" />
      <circle cx="45" cy="46" r="4" opacity="0.6" />
      <circle cx="-55" cy="37" r="4.5" opacity="0.62" />
      <circle cx="19" cy="-59" r="4" opacity="0.7" />
      <circle cx="-12" cy="-72" r="4.5" opacity="0.6" />
      <circle cx="62" cy="-43" r="4" opacity="0.56" />
      <circle cx="-70" cy="-52" r="4" opacity="0.5" />
      <circle cx="77" cy="25" r="5" opacity="0.5" />
      <circle cx="-79" cy="14" r="4" opacity="0.6" />
      <circle cx="2" cy="67" r="4" opacity="0.6" />
      <circle cx="33" cy="78" r="4.5" opacity="0.48" />
      <circle cx="-42" cy="77" r="4" opacity="0.52" />
      <circle cx="88" cy="-65" r="4" opacity="0.45" />
      <circle cx="-99" cy="-12" r="4.5" opacity="0.48" />
      <circle cx="104" cy="53" r="4" opacity="0.42" />
      <circle cx="-73" cy="91" r="4" opacity="0.42" />
      <circle cx="57" cy="-89" r="4" opacity="0.48" />
      <circle cx="-46" cy="-101" r="4" opacity="0.45" />
      <circle cx="8" cy="112" r="4.5" opacity="0.4" />
    </g>
    <path d="M-12 0H12 M0 -12V12" fill="none" stroke="#050c16" stroke-width="9" stroke-linecap="round" />
    <path d="M-12 0H12 M0 -12V12" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
